name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ==================== Mac + Android 构建 ====================
  build-mac-android:
    runs-on: macos-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      # --- Android ---
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      
      - name: Decode Android debug keystore
        run: |
          mkdir -p $HOME/.android
          printf '%s' "${{ secrets.DEBUG_KEYSTORE }}" | base64 -d > $HOME/.android/debug.keystore
      
      - name: Verify Android keystore
        run: keytool -list -keystore $HOME/.android/debug.keystore -storepass android -alias androiddebugkey
      
      - name: Make gradlew executable
        working-directory: VoiceSyncAndroid
        run: chmod +x gradlew
      
      - name: Build Android APK
        working-directory: VoiceSyncAndroid
        run: ./gradlew assembleRelease
      
      - name: Rename Android APK
        run: |
          APK=$(find VoiceSyncAndroid/app/build/outputs/apk/release -name '*.apk' | head -1)
          mv "$APK" VoiceSync-Android-${{ steps.version.outputs.VERSION }}.apk
      
      # --- Mac ---
      
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      
      - name: Build Mac app (Archive)
        working-directory: VoiceSyncMac
        run: |
          xcodebuild archive \
            -project VoiceSyncMac.xcodeproj \
            -scheme VoiceSyncMac \
            -configuration Release \
            -archivePath build/VoiceSyncMac.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      
      - name: Create export_options.plist
        working-directory: VoiceSyncMac
        run: |
          mkdir -p build
          cat > build/export_options.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>mac-application</string>
          </dict>
          </plist>
          EOF
      
      - name: Export Mac app
        working-directory: VoiceSyncMac
        run: |
          xcodebuild -exportArchive \
            -archivePath build/VoiceSyncMac.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/export_options.plist
      
      - name: Create Mac ZIP
        run: |
          cd VoiceSyncMac/build/export
          zip -r -9 ../../../VoiceSyncMac-${{ steps.version.outputs.VERSION }}.zip VoiceSyncMac.app
      
      # --- 上传构建产物 ---
      
      - name: Upload Mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: VoiceSyncMac-${{ steps.version.outputs.VERSION }}.zip
      
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: VoiceSync-Android-${{ steps.version.outputs.VERSION }}.apk

  # ==================== Windows 构建 ====================
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: VoiceSyncWindows/requirements.txt
      
      - name: Install dependencies
        working-directory: VoiceSyncWindows
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build Windows executable
        working-directory: VoiceSyncWindows
        run: pyinstaller voicesync.spec --noconfirm
      
      - name: Create Windows ZIP
        shell: bash
        run: |
          cd VoiceSyncWindows/dist
          7z a -tzip "../../VoiceSync-Windows-${{ steps.version.outputs.VERSION }}.zip" VoiceSync/
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: VoiceSync-Windows-${{ steps.version.outputs.VERSION }}.zip

  # ==================== 发布到 GitHub Release ====================
  release:
    runs-on: ubuntu-latest
    needs: [build-mac-android, build-windows]
    permissions:
      contents: write
    
    steps:
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      
      - name: List artifacts
        run: ls -lhR artifacts/
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: VoiceSync v${{ steps.version.outputs.VERSION }}
          files: |
            artifacts/VoiceSyncMac-${{ steps.version.outputs.VERSION }}.zip
            artifacts/VoiceSync-Android-${{ steps.version.outputs.VERSION }}.apk
            artifacts/VoiceSync-Windows-${{ steps.version.outputs.VERSION }}.zip
          body: |
            # 🎙️ VoiceSync v${{ steps.version.outputs.VERSION }}

            ## 📥 下载说明

            ### Windows 用户
            下载 **VoiceSync-Windows-${{ steps.version.outputs.VERSION }}.zip**，解压后运行 `VoiceSync.exe` 即可。
            - 无需安装 Python 或其他运行时
            - 首次运行如果弹出 Windows Defender 提示，点击"仍要运行"
            - 如防火墙提示，请允许网络访问

            ### macOS 用户
            下载 **VoiceSyncMac-${{ steps.version.outputs.VERSION }}.zip**，解压后将 `VoiceSyncMac.app` 拖入应用程序文件夹。
            - ✅ 网络连接权限（必须）- 接收手机数据
            - ✅ 辅助功能权限（可选）- 自动粘贴功能

            ### Android 用户
            下载 **VoiceSync-Android-${{ steps.version.outputs.VERSION }}.apk**，直接安装即可。

            需要手机和电脑连接在同一 Wi-Fi 网络下。

            ---

            ## ✨ 更新内容

            详见 commit 历史

            ---

            ## 🚀 快速开始

            1. **电脑端**：打开应用，查看显示的本机 IP 地址
            2. **Android 端**：打开应用，点击扫描按钮自动发现电脑，或手动输入 IP 地址
            3. **开始使用**：在手机上说话，文字自动出现在电脑上

            详细使用说明请查看 [README](https://github.com/sedationh/VoiceSync/blob/main/README.md)
